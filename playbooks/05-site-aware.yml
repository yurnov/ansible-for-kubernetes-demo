---
# 5 — One playbook, many sites: switch connection per task at runtime
#
# The production pattern this comes from: the same playbook runs on every
# site. When it executes ON the site it manages (THIS_SITE_NAME matches),
# tasks run locally; for every OTHER site they run inside that site's
# worker pod — reached through the kubectl connection plugin.
#
#   THIS_SITE_NAME=site-a ansible-playbook playbooks/05-site-aware.yml
#
# site-a tasks run on your machine, site-b tasks run inside the pod on the
# site-b cluster. Flip the variable and watch it invert.
#
# Requires the ansible-worker pods from playbook 03.
#
# Also demonstrated here, because everyone confuses them:
#   environment:                     -> variables INSIDE the pod (for the task)
#   ansible_kubectl_local_env_vars:  -> variables for the LOCAL kubectl process
#                                       on the controller (auth plugins, proxies)

- name: Site-aware execution
  hosts: sites
  gather_facts: false
  vars:
    this_site: "{{ lookup('ansible.builtin.env', 'THIS_SITE_NAME') }}"

  tasks:
    - name: Find this site's worker pod through the API (name is data, not config)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Pod
        namespace: "{{ kube_namespace }}"
        label_selectors:
          - app=ansible-worker
        field_selectors:
          - status.phase=Running
      register: worker_query

    - name: Remember the pod name
      ansible.builtin.set_fact:
        dynamic_pod_name: "{{ worker_query.resources[0].metadata.name }}"

    # THE trick: ansible_connection decided per task, at runtime.
    # 'local' when we are already at this site, kubectl-into-the-pod otherwise.
    - name: Run where it makes sense
      vars:
        ansible_connection: "{{ (this_site == site_id) | ternary('local', 'kubernetes.core.kubectl') }}"
        # GOTCHA: the interpreter belongs to the HOST, not to the connection.
        # The inventory pins it to the controller's Python, and that path does
        # not exist inside the pod. Switch the interpreter together with the
        # connection, or the module will fail with rc=127.
        ansible_python_interpreter: "{{ (this_site == site_id) | ternary(ansible_playbook_python, '/usr/local/bin/python3') }}"
        ansible_kubectl_namespace: "{{ kube_namespace }}"
        ansible_kubectl_config: "{{ kubeconfig }}"
        ansible_kubectl_pod: "{{ dynamic_pod_name }}"
        ansible_kubectl_container: worker
        # Passed to the LOCAL kubectl the connection plugin spawns.
        # This is how kubectl's exec-based auth (aws eks get-token, gcloud,
        # azure kubelogin) gets its credentials — the task's `environment:`
        # keyword can NOT reach that process.
        ansible_kubectl_local_env_vars:
          AWS_SHARED_CREDENTIALS_FILE: "{{ awscredentials | default('') }}"
          AWS_CONFIG_FILE: "{{ awsconfig | default('') }}"
          AWS_PROFILE: "{{ aws_profile | default('') }}"
          AWS_REGION: "{{ aws_region | default('') }}"
      ansible.builtin.command: uname -n
      register: where
      changed_when: false

    - name: Same playbook, different execution locations
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ (this_site == site_id) | ternary('LOCAL', 'IN-POD') }}
          -> ran on '{{ where.stdout }}'

    # ------------------------------------------------------------------
    # environment: vs ansible_kubectl_local_env_vars — seeing is believing.
    # Both tasks below run INSIDE the worker pod and print $WHO_SET_ME.
    # ------------------------------------------------------------------

    # These two only make sense where the connection IS kubectl: at the local
    # site there is no kubectl process to give variables to, so they skip —
    # which is itself worth saying out loud.
    #
    # Note what CANNOT be shown by printing variables from the task: local_env_vars
    # is never visible to the task, on either site. Locally the kubectl connection
    # plugin is not in play at all; in-pod the variable stayed with kubectl on the
    # controller. That is why the second task proves it from the other end instead.
    - name: environment vs local_env_vars, side by side in one task
      when: this_site != site_id
      vars:
        ansible_connection: kubernetes.core.kubectl
        ansible_python_interpreter: /usr/local/bin/python3
        ansible_kubectl_namespace: "{{ kube_namespace }}"
        ansible_kubectl_config: "{{ kubeconfig }}"
        ansible_kubectl_pod: "{{ dynamic_pod_name }}"
        ansible_kubectl_container: worker
        # Distinct names on purpose: with one shared name `environment` simply
        # wins inside the pod and the comparison shows nothing.
        ansible_kubectl_local_env_vars:
          SET_BY_LOCAL_ENV_VARS: "reached the kubectl process"
      environment:
        SET_BY_ENVIRONMENT: "reached the task inside the pod"
      ansible.builtin.shell: |
        echo "SET_BY_ENVIRONMENT      -> ${SET_BY_ENVIRONMENT:-(not set in the pod)}"
        echo "SET_BY_LOCAL_ENV_VARS   -> ${SET_BY_LOCAL_ENV_VARS:-(not set in the pod)}"
      register: env_compare
      changed_when: false

    # The positive half: no ansible_kubectl_config here, so the ONLY way kubectl
    # can find a cluster is the KUBECONFIG that local_env_vars hands it. If the
    # option did nothing, this host would be UNREACHABLE.
    - name: kubeconfig delivered to kubectl ONLY via local_env_vars
      when: this_site != site_id
      vars:
        ansible_connection: kubernetes.core.kubectl
        ansible_python_interpreter: /usr/local/bin/python3
        ansible_kubectl_namespace: "{{ kube_namespace }}"
        ansible_kubectl_pod: "{{ dynamic_pod_name }}"
        ansible_kubectl_container: worker
        ansible_kubectl_local_env_vars:
          KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: uname -n
      register: via_local_env_vars
      changed_when: false

    - name: Compare
      when: this_site != site_id
      ansible.builtin.debug:
        msg: "{{ env_compare.stdout_lines + proof }}"
      vars:
        proof:
          - "both were set on the SAME task - only environment crossed into the pod"
          - "yet kubectl still reached {{ via_local_env_vars.stdout }} with no --kubeconfig,"
          - "using only the KUBECONFIG that local_env_vars gave the local process"
          - "that is where aws eks get-token, gcloud, kubelogin and proxies read theirs"
