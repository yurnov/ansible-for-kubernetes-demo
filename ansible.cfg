# Configuration for this demo. Run every playbook from the repository root so
# that this file is picked up:
#   ansible-playbook playbooks/01-resources.yml

[defaults]
inventory = ./inventory/sites.yml
# The k8s modules talk to the API from the controller; facts about "localhost"
# are rarely needed here and only slow things down. Plays that need facts
# enable gathering explicitly.
gathering = explicit
# Silences interpreter-discovery warnings, which matter once tasks run inside
# pods with a pinned ansible_python_interpreter.
interpreter_python = auto_silent
# YAML-formatted task results are much easier to read than the default JSON.
callback_result_format = yaml

[inventory]
enable_plugins = ansible.builtin.yaml
